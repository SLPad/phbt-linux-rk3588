%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/opsco,sk9822.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: OPSCO SK9822 SPI RGB LED chain
maintainers:
  - liiir1985 <liiir1985@hotmail.com>
properties:
  compatible:
    const: opsco,sk9822
  reg:
    maxItems: 1
  spi-max-frequency:
    maximum: 30000000
  '#address-cells':
    const: 1
  '#size-cells':
    const: 0
patternProperties:
  '^led@[0-9a-f]+$':
    type: object
    properties:
      reg:
        maxItems: 1
      label: true
    required:
      - reg
    additionalProperties: false
required:
  - compatible
  - reg
  - '#address-cells'
  - '#size-cells'
allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
unevaluatedProperties: false
